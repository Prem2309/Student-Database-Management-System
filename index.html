<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Student Management System</h1>

    <!-- Add Student Form -->
    <div class="form-section">
        <h2>Add Student</h2>
        <form id="addStudentForm">
            <label for="studentId">Student ID:</label>
            <input type="number" id="studentId" required><br><br>

            <label for="studentName">Student Name:</label>
            <input type="text" id="studentName" required><br><br>

            <label for="studentAge">Student Age:</label>
            <input type="number" id="studentAge" required><br><br>

            <button type="submit">Add Student</button>
        </form>
    </div>

    <!-- List of Students -->
    <div class="list-section">
        <h2>List of Students</h2>
        <ul id="studentList"></ul>
    </div>

    <!-- Remove Student -->
    <div class="remove-section">
        <h2>Remove Student</h2>
        <label for="removeId">Enter Student ID to Remove:</label>
        <input type="number" id="removeId">
        <button onclick="removeStudent()">Remove Student</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
